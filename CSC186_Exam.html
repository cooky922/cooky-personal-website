{t:2,q:"In a PACT analysis, 'Co-operation and Complexity' is a characteristic of which element?",a:["People","Technologies","Contexts","Activities"],c:3},

let pool = [...ALL_Q];
let order = [];
let cur = 0;
let score = 0;
let answered = [];
let answered_correct = [];
let activeFilter = 'all';
let wrongOnly = false;

function shuffle(arr) {
  for (let i = arr.length-1; i > 0; i--) {
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]] = [arr[j],arr[i]];
  }
  return arr;
}

function setFilter(f, btn) {
  activeFilter = f;
  document.querySelectorAll('.fb').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  restart();
}

function buildOrder() {
  let src = ALL_Q.map((q,i) => i);
  if (activeFilter !== 'all') src = src.filter(i => ALL_Q[i].t == activeFilter);
  if (wrongOnly) src = src.filter(i => answered_correct[i] === false);
  order = shuffle(src);
}

function start() {
  score = 0; cur = 0;
  answered = new Array(ALL_Q.length).fill(null);
  answered_correct = new Array(ALL_Q.length).fill(null);
  buildOrder();
  document.getElementById('results').classList.remove('show');
  document.getElementById('quizArea').style.display = '';
  showQ();
}

function restart() {
  wrongOnly = false;
  start();
}

function restartWrong() {
  wrongOnly = true;
  buildOrder();
  if (order.length === 0) { alert('No wrong answers to retry!'); return; }
  cur = 0;
  document.getElementById('results').classList.remove('show');
  document.getElementById('quizArea').style.display = '';
  showQ();
}

function topicClass(t) { return t===2?'t2':t===3?'t3':''; }
function topicLabel(t) { return ['','Topic 1: Intro to HCI','Topic 2: PACT','Topic 3: Understanding Users'][t]; }

function showQ() {
  if (cur >= order.length) { showResults(); return; }
  const qi = order[cur];
  const q = ALL_Q[qi];

  const tag = document.getElementById('topicTag');
  tag.textContent = topicLabel(q.t);
  tag.className = 'topic-tag ' + topicClass(q.t);

  document.getElementById('qNum').textContent = `Question ${cur+1} of ${order.length}`;
  document.getElementById('qText').textContent = q.q;

  const opts = document.getElementById('opts');
  opts.innerHTML = '';
  const letters = ['A','B','C','D'];
  // shuffle answer options while tracking correct
  const indices = shuffle([0,1,2,3]);
  q._shuffled = indices;
  indices.forEach((origIdx, pos) => {
    const div = document.createElement('div');
    div.className = 'opt';
    div.innerHTML = `<span class="letter">${letters[pos]}</span><span>${q.a[origIdx]}</span>`;
    div.onclick = () => selectOpt(qi, origIdx, div);
    opts.appendChild(div);
  });

  document.getElementById('feedback').className = 'feedback';
  document.getElementById('feedback').textContent = '';
  document.getElementById('btnNext').classList.remove('show');
  updateProg();
}

function selectOpt(qi, chosen, el) {
  const q = ALL_Q[qi];
  if (answered[qi] !== null) return;
  answered[qi] = chosen;

  const allOpts = document.getElementById('opts').querySelectorAll('.opt');
  allOpts.forEach((opt, pos) => {
    const origIdx = q._shuffled[pos];
    opt.classList.add('disabled');
    if (origIdx === q.c) opt.classList.add('correct');
    else if (origIdx === chosen) opt.classList.add('wrong');
  });

  const fb = document.getElementById('feedback');
  if (chosen === q.c) {
    score++;
    answered_correct[qi] = true;
    fb.textContent = '✓ Correct!';
    fb.className = 'feedback show ok';
  } else {
    answered_correct[qi] = false;
    const letters = ['A','B','C','D'];
    const correctPos = q._shuffled.indexOf(q.c);
    fb.textContent = `✗ Incorrect. The correct answer is ${letters[correctPos]}: ${q.a[q.c]}`;
    fb.className = 'feedback show bad';
  }

  document.getElementById('btnNext').classList.add('show');
  document.getElementById('btnNext').textContent = cur+1 < order.length ? 'Next question →' : 'See results →';
  updateProg();
}

function nextQ() { cur++; showQ(); }

function updateProg() {
  const done = order.slice(0, cur + (answered[order[cur]]!==null?1:0)).filter(i => answered[i]!==null).length;
  const pct = order.length ? (done/order.length*100) : 0;
  document.getElementById('progFill').style.width = pct+'%';
  document.getElementById('progTxt').textContent = `${done} / ${order.length}`;
  document.getElementById('scoreBadge').textContent = `Score: ${score}`;
}

function showResults() {
  document.getElementById('quizArea').style.display = 'none';
  const r = document.getElementById('results');
  r.classList.add('show');

  const total = order.length;
  const pct = Math.round(score/total*100);
  document.getElementById('rScore').textContent = `${score}/${total}`;
  document.getElementById('rCorrect').textContent = score;
  document.getElementById('rWrong').textContent = total - score;
  document.getElementById('rPct').textContent = pct+'%';

  const grades = ['','Keep studying!','Getting there!','Good work!','Great job!','Excellent!'];
  const gi = pct<50?1:pct<65?2:pct<75?3:pct<90?4:5;
  document.getElementById('rLabel').textContent = grades[gi] + ` — ${pct}% accuracy`;

  const rl = document.getElementById('reviewList');
  rl.innerHTML = '<h3>Review</h3>';
  order.forEach((qi, pos) => {
    const q = ALL_Q[qi];
    const ok = answered_correct[qi];
    const div = document.createElement('div');
    div.className = 'rev-item';
    div.innerHTML = `<span class="ri">${pos+1}.</span><span class="rs ${ok?'ok':'bad'}">${ok?'✓':'✗'}</span><span class="rev-q">${q.q}</span>`;
    rl.appendChild(div);
  });

  document.getElementById('progFill').style.width = '100%';
  document.getElementById('progTxt').textContent = `${total} / ${total}`;
  document.getElementById('scoreBadge').textContent = `Score: ${score}`;
}

start();
</script>
